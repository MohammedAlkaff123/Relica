<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RELICA: Still Here</title>
  <meta name="description" content="A NASA Space Apps Challenge 2026 experience: drive, fly and listen as the machines humanity left in space tell their stories.">
  <meta name="theme-color" content="#101820">
  <link rel="icon" href="public/brand/favicon.png">
  <link rel="preload" href="public/brand/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="public/brand/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <!-- No build step. The libraries are local copies in vendor/ (see vendor/README.md), so the game
       also works without internet once the page is open. The code imports them by bare name. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/",
      "@dimforge/rapier3d-compat": "./vendor/rapier.es.js",
      "lil-gui": "./vendor/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body class="on-landing">
  <!-- Landing page: the first thing anyone sees. -->
  <div id="sky" aria-hidden="true"></div>
  <canvas id="landing-3d" aria-hidden="true"></canvas>

  <main id="landing" class="landing">
    <div class="landing-top">
      <div class="segmented" id="landing-lang" role="group" aria-label="Language / اللغة">
        <button type="button" class="seg" lang="ar" data-lang="ar">العربية</button>
        <button type="button" class="seg" lang="en" data-lang="en">English</button>
      </div>
    </div>

    <div class="landing-center">
      <div class="lockup">
        <img class="lockup-relica" src="public/brand/logos/relica-lockup-ivory-1200.png" alt="Relica" width="600" height="220">
        <span class="lockup-x" aria-hidden="true">×</span>
        <img class="lockup-spaceapps" src="public/brand/partners/space-apps-white.svg" alt="NASA Space Apps Challenge" width="561" height="221">
      </div>
      <p class="landing-challenge"><span data-t="landing.challenge">NASA Space Apps Challenge 2026</span><span class="dot" aria-hidden="true"></span><span data-t="landing.theme">Abandoned, but not Forgotten</span></p>
      <h1 class="landing-title" data-t="landing.title">RELICA: Still Here</h1>
      <p class="landing-line" data-t="landing.line">Drive, fly and listen as the machines humanity left in space tell the stories they lived.</p>
      <div class="landing-actions">
        <a class="btn btn-ghost-light" id="github" href="https://github.com/MohammedAlkaff123/Relica" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2.8a9.3 9.3 0 0 0-2.9 18.1c.5.1.6-.2.6-.5v-1.7c-2.6.6-3.1-1.2-3.1-1.2-.4-1.1-1-1.4-1-1.4-.9-.6 0-.6 0-.6.9.1 1.4 1 1.4 1 .8 1.4 2.2 1 2.7.8.1-.6.3-1 .6-1.2-2.1-.2-4.3-1-4.3-4.6 0-1 .4-1.9 1-2.5-.1-.3-.4-1.2.1-2.5 0 0 .8-.3 2.6 1a9 9 0 0 1 4.7 0c1.8-1.3 2.6-1 2.6-1 .5 1.3.2 2.2.1 2.5.6.6 1 1.5 1 2.5 0 3.6-2.2 4.4-4.3 4.6.3.3.6.8.6 1.6v2.4c0 .3.2.6.7.5A9.3 9.3 0 0 0 12 2.8z"/></svg>
          <span class="btn-words"><span class="btn-label" data-t="landing.github">GitHub</span><span class="btn-sub" data-t="landing.githubSub">repository</span></span>
        </a>
        <button class="btn btn-start" id="start" type="button">
          <span class="btn-label" data-t="landing.start">Start the experience</span>
          <span class="start-dot" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6c0-.9 1-1.5 1.8-1l9 6.4c.7.5.7 1.5 0 2l-9 6.4c-.8.5-1.8 0-1.8-1z"/></svg></span>
        </button>
      </div>
      <p class="landing-note" data-t="landing.desktop">Best experienced on a computer with a keyboard</p>
    </div>
  </main>

  <!-- Loading screen: real progress, file by file. -->
  <section id="loader" class="loader hidden" aria-live="polite">
    <img class="loader-symbol" src="public/brand/logos/relica-symbol-ivory-256.png" alt="" width="128" height="128">
    <h2 data-t="load.title">Preparing the expedition</h2>
    <div class="load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="load-fill"></span></div>
    <div class="load-row"><span id="load-step"></span><bdi id="load-pct" dir="ltr">0%</bdi></div>
    <div class="load-sub"><bdi id="load-bytes" dir="ltr"></bdi><span id="load-files"></span></div>
    <div class="load-error hidden">
      <p data-t="load.error"></p>
      <button class="btn btn-start" type="button" id="load-retry"><span class="btn-label" data-t="load.retry"></span></button>
    </div>
  </section>

  <!-- The game: the 3D view, the in-game interface and the menus. -->
  <canvas id="view"></canvas>
  <div id="ui"></div>
  <div id="shell"></div>
  <script type="module" src="src/boot.js"></script>
</body>
</html>
